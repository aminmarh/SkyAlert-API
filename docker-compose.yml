services:
  db:
    image: postgres
    container_name: db
    restart: always
    ports:
      - 5123:5432
    env_file:
      - .env    
    volumes:
      - ./pData:/var/lib/postgresql/data
    healthcheck:      
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -t 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000    
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy    
    links: 
        - db
  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
     - 8080:8080
    depends_on:
    - db